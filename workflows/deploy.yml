name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
      runs-level: ubuntu-latest
      steps:
        - name: Checkout Code
          uses: actions/checkout@v4

        - name: Deploy via SSH
          uses: appleboy/ssh-action@v1.0.3
          with: 
            host: ${{ secrets.EC2_HOST }}
            username: ${{ secrets.EC2_USERNAME }}
            key: ${{ secrets.SSH_PRIVATE_KEY }}
            script: |
              # 1
              mkdir -p ~/my-app
              cd ~/my-app
              
              # 2
              rm -rf *
              
              # 3
              git clone https://github.com{{ github.repository }}.git .
              
              # 4. Собираем новый Docker-образ
              docker build -t my-web-app:latest .
              
              # 5. Останавливаем старый контейнер, если он запущен
              docker stop my-app-container || true
              docker rm my-app-container || true
              
              # 6. Запускаем новый контейнер
              docker run -d --name my-app-container -p 80:3000 --restart always my-web-app:latest
